<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta
      name="description"
      content="MARÉVIA: biquínis e maiôs em cores e estampas para praia e piscina."
    />
    <title>MARÉVIA — Biquínis e Maiôs</title>
    <script>
      // Aplica o tema antes da pintura, para a página não piscar clara.
      // Usa a escolha salva; sem ela, segue o modo do aparelho.
      (function () {
        var t;
        try {
          t = localStorage.getItem("marevia-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
